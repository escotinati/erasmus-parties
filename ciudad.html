<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ciudad — Erasmus Verified</title>
        <!-- Google Fonts: Syne (display) + Inter (body) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap"
            rel="stylesheet"
        />
        <!-- Design System tokens -->
        <link rel="stylesheet" href="/src/styles/tokens.css" />
        <link rel="stylesheet" href="/src/styles/typography.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/src/css/styles.css?v=3" />
        <script src="/src/js/experience.js"></script>

        <!-- NUEVO -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
        />
        <!-- NUEVO -->
    </head>

    <body>
        <!-- ── TOP NAV (React, rama react/menu) — ver src/react/TopbarNav.jsx ── -->
        <script>
            window.__BACK_LINK__ = { i18nKey: 'nav.home', label: 'Volver', href: 'index.html' };
        </script>
        <div id="nav-root"></div>
        <script type="module" src="/src/react/mount-topbar-nav.jsx"></script>

        <main class="city-main">
            <div class="city-page" id="cityPage">
                <div class="city-header">
                    <span class="city-flag" id="cityFlag">🌍</span>
                    <div class="city-location" id="cityLocation"></div>
                    <h1 class="city-name" id="cityName"></h1>
                    <p class="city-desc" data-i18n="city.desc_intro">
                        Elige tu plataforma y únete a la comunidad Erasmus antes de llegar.
                    </p>
                </div>
                <div class="actions" id="actionsWrap"></div>
                <div class="info-box">
                    <span class="info-icon">📌</span>
                    <p class="info-text">
                        <strong data-i18n="city.tip_label">Consejo:</strong>
                        <span data-i18n="city.tip_text"
                            >Al unirte, preséntate indicando tu universidad y fechas de Erasmus. La
                            comunidad te recibirá con los brazos abiertos.</span
                        >
                    </p>
                </div>
                <div id="city-extra"></div>
            </div>
        </main>

        <!-- FOOTER (React, rama react/menu) — ver src/react/Footer.jsx -->
        <div id="footer-root"></div>
        <script type="module" src="/src/react/mount-footer.jsx"></script>

        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""
        ></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
        <script src="/src/js/lib/supabaseClient.js"></script>
        <script src="/src/utils/i18n.js"></script>
        <script src="/src/utils/translations.js"></script>
        <script src="/src/js/langSwitcher.js"></script>
        <script src="/src/js/services/citiesService.js"></script>
        <script src="/src/js/utils/sanitize.js"></script>
        <script src="/src/js/geocoder.js"></script>
        <script src="/src/js/map-helpers.js"></script>
        <script src="/src/js/services/partnersService.js"></script>
        <script src="/src/js/tracking.js"></script>
        <script src="/src/js/mapPartners.js"></script>
        <script src="/src/js/cityMap.js"></script>
        <script src="/src/js/ciudad.js"></script>

        <!-- Mobile-nav overlay: ahora vive en src/react/TopbarNav.jsx (rama react/menu) -->

        <!-- ── APP BOTTOM NAV (móvil) ────────────────────────── -->
        <nav class="app-bottom-nav" id="appBottomNav" aria-label="Navegación principal">
            <a href="servicios.html" class="app-bottom-nav-item">
                <span class="material-symbols-outlined">storefront</span>
                <span data-i18n="nav.services">Servicios</span>
            </a>
            <a href="viajes.html" class="app-bottom-nav-item">
                <span class="material-symbols-outlined">flight</span>
                <span data-i18n="nav.trips">Viajes</span>
            </a>
            <a
                href="https://erasmusparties.org"
                target="_blank"
                rel="noopener noreferrer"
                class="app-bottom-nav-item app-bottom-nav-item--parties"
            >
                <span class="material-symbols-outlined">nightlife</span>
                <span data-i18n="nav.parties_bottom">Fiestas</span>
            </a>
        </nav>
        <script>
            /* ── Ítem activo (solo bottom-nav) ─────────────────────────
               El toggle de hamburguesa + ítem activo del topbar/mobile-nav
               vive en src/react/TopbarNav.jsx; el año del copyright en
               src/react/Footer.jsx (rama react/menu). */
            (function () {
                var page =
                    (window.location.pathname.split('/').pop() || 'index.html').split('?')[0] ||
                    'index.html';
                document
                    .querySelectorAll('.app-bottom-nav .app-bottom-nav-item')
                    .forEach(function (a) {
                        var href = (a.getAttribute('href') || '').split('?')[0];
                        if (href && !href.startsWith('http') && href === page)
                            a.classList.add('app-bottom-nav-item--active');
                    });
            })();
        </script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                window.I18n.applyTranslations();
            });
        </script>
    </body>
</html>
