<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Todas las ciudades — Erasmus Verified</title>
        <!-- Google Fonts: Syne (display) + Inter (body) -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- Design System tokens -->
        <link rel="stylesheet" href="/src/styles/tokens.css" />
        <link rel="stylesheet" href="/src/styles/typography.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/src/css/styles.css" />
        <link rel="stylesheet" href="/src/css/animations.css" />
        <script src="/src/js/experience.js"></script>
        <style>
            /* ── Estilos específicos de esta página ─────────────────── */
            /* .all-cities-hero y sus responsive → css/styles.css §5    */

            /* Barra de búsqueda — mismo componente .search-bar que el hero
               de index.html (icono + input, misma superficie de cristal),
               reutilizado tal cual en vez de reinventar un input propio.
               width:100% explícito a propósito: <body> es flex-column, y
               un hijo directo suyo con solo max-width + margin:auto (sin
               width) se encoge a su contenido en vez de estirarse — es el
               mismo motivo por el que hacía falta más abajo en
               .cities-container. */
            .filter-bar {
                width: 100%;
                max-width: var(--container-max);
                margin: 0 auto;
                /* Mobile-first: margen móvil por defecto, revierte en
                   --bp-md */
                padding: 24px var(--margin-mobile) 0;
                display: flex;
                align-items: center;
                gap: 16px;
                flex-wrap: wrap;
            }

            .filter-bar .search-bar {
                flex: 1;
                min-width: 260px;
            }

            /* Solo visible cuando el input tiene texto (JS añade
               .has-value al wrap) — sin él, es un botón fantasma que no
               hace nada. Vive dentro de .search-bar-input, después del
               input, en vez de superpuesto en absolute: ese componente no
               reserva hueco para nada a la derecha. */
            .filter-clear {
                display: none;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                flex-shrink: 0;
                border: none;
                background: none;
                border-radius: var(--radius-full);
                color: var(--on-surface-variant);
                cursor: pointer;
                transition: background var(--anim-duration-fast) var(--anim-easing-standard);
            }

            .filter-clear:hover {
                background: var(--surface-container);
                color: var(--on-surface);
            }

            .search-bar.has-value .filter-clear {
                display: flex;
            }

            .filter-count {
                font-size: 13px;
                color: var(--on-surface-variant);
                white-space: nowrap;
            }
            /* Listado de ciudades — mismo motivo del width:100% que
               .filter-bar arriba (hijo directo de un <body> flex-column). */

            .cities-container {
                width: 100%;
                max-width: var(--container-max);
                margin: 0 auto;
                /* Mobile-first: margen móvil por defecto, revierte en
                   --bp-md */
                padding: 40px var(--margin-mobile) 80px;
            }

            .letter-group {
                margin-bottom: 48px;
            }

            .letter-group[hidden] {
                display: none;
            }

            .letter-heading {
                font-family: var(--font-display);
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--primary);
                margin-bottom: 16px;
                padding-bottom: 10px;
                border-bottom: 1px solid var(--outline-variant);
            }

            /* Las cards en sí (.city-card, foto + bandera + nombre + país)
               son el mismo componente que usa ciudades.html — toda su
               regla vive en styles.css (a.country-card, a.city-card), no
               se redefine aquí salvo el hover de la imagen (abajo): en
               vez del zoom+oscurecido de siempre, foto en blanco y negro
               en reposo que pasa a color al hacer hover — más propio de
               un directorio (elegir entre muchas) que del efecto original
               (pensado para una sola card protagonista). Selector
               scopeado a .city-items-grid para no tocar ciudades.html,
               que sigue con el hover de siempre. */
            .city-items-grid .card-img {
                filter: grayscale(100%) brightness(0.85);
                transition: filter var(--anim-duration-base) var(--anim-easing-standard);
            }

            .city-items-grid .city-card:hover .card-img {
                filter: grayscale(0%) brightness(0.85);
                transform: none;
            }

            /* .anim-fade-up.is-visible:not(:hover) (animations.css) resetea
               transform a translateY(0) salvo en :hover, para no competir
               con componentes que sí animan su propio transform al hover
               (card-hoverable, accordion-card). .city-card no es uno de
               esos casos — su hover vive solo en .card-img (arriba) — así
               que sin esta regla la card "cae" de vuelta a
               translateY(var(--anim-translate-md)) al pasar el ratón. */
            .city-items-grid .city-card.anim-fade-up:hover {
                transform: translateY(0);
            }

            /* .city-card:hover cambia border-color a --primary
               (styles.css) — en este directorio el color ya lo da la foto
               a color, así que el borde se mantiene sin cambios. */
            .city-items-grid .city-card:hover {
                border-color: var(--outline-variant);
            }

            /* Solo el grid que las contiene es propio de esta página:
               auto-fill en vez de las 4 columnas fijas de ciudades.html,
               porque aquí cada letra puede tener 1 ciudad o 50.
               Mobile-first: 2 columnas fijas por defecto (ver también
               la nota de auto-fill más abajo), auto-fill desde
               --bp-sm. */
            .city-items-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }

            /* No results */

            .no-results {
                text-align: center;
                padding: 80px 20px;
                color: var(--on-surface-variant);
                display: none;
            }

            .no-results.is-visible {
                display: block;
            }

            .no-results-icon {
                font-size: 3rem;
                display: block;
                margin-bottom: 16px;
            }

            .no-results h3 {
                font-size: 1.1rem;
                font-weight: 700;
                color: var(--on-surface);
                margin-bottom: 8px;
            }

            /* Responsive */

            @media (min-width: 600px) {
                /* --bp-sm — auto-fill con minmax(170px, 1fr) ya se
                   adapta solo casi siempre, pero por debajo de este
                   punto (ver base más arriba) el hueco disponible cae
                   justo por debajo de 2×170px+gap y colapsaría a 1
                   columna — demasiado grande. Se fuerza 2 columnas
                   fijas hasta aquí, mismo criterio que
                   .cities-grid.cols-2 en ciudades.html. */
                .city-items-grid {
                    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
                }
            }

            @media (min-width: 900px) {
                /* --bp-md */
                .filter-bar {
                    padding: 32px var(--margin-desktop) 0;
                }
                .cities-container {
                    padding: 48px var(--margin-desktop) 100px;
                }
            }
        </style>
    </head>

    <body>
        <!-- ── TOP NAV (React, rama react/menu) — ver src/react/Nav.jsx ── -->
        <div id="nav-root"></div>
        <script type="module" src="/src/react/mount-nav.jsx"></script>

        <!-- HERO -->
        <div class="all-cities-hero">
            <div style="max-width: var(--container-max); margin: 0 auto">
                <span class="eyebrow eyebrow--primary" data-i18n="cities.all_eyebrow"
                    >DESTINOS ERASMUS+</span
                >
                <h1 data-i18n="cities.all_title">Todas las ciudades</h1>
                <p>
                    <strong id="totalCount">—</strong>
                    <span data-i18n="cities.stats_middle">ciudades en</span>
                    <strong id="totalCountries">—</strong>
                    <span data-i18n="cities.stats_suffix"
                        >países europeos. Encuentra tu destino y únete a la comunidad antes de
                        llegar.</span
                    >
                </p>
            </div>
        </div>

        <!-- FILTER BAR — mismo componente .search-bar que el hero de index.html -->
        <div class="filter-bar">
            <div class="search-bar" id="filterInputWrap">
                <div class="search-bar-input">
                    <span class="material-symbols-outlined search-icon">search</span>
                    <input
                        type="text"
                        id="filterInput"
                        placeholder="Busca tu ciudad…"
                        data-i18n="cities.filter_placeholder"
                        autocomplete="off"
                    />
                </div>
                <button
                    type="button"
                    class="filter-clear"
                    id="filterClear"
                    aria-label="Limpiar filtro"
                >
                    <span class="material-symbols-outlined" style="font-size: 18px">close</span>
                </button>
            </div>
            <span class="filter-count" id="filterCount"></span>
        </div>

        <!-- CITIES LIST -->
        <div class="cities-container" id="citiesSection">
            <div class="no-results" id="noResults">
                <span class="no-results-icon">🔍</span>
                <h3 data-i18n="cities.no_results_title">Sin resultados</h3>
                <p data-i18n="cities.no_results_body">Prueba con otro nombre de ciudad o país.</p>
            </div>
            <!-- JS rellena los grupos de letras aquí -->
        </div>

        <!-- FOOTER (React, rama react/menu) — ver src/react/Footer.jsx -->
        <div id="footer-root"></div>
        <script type="module" src="/src/react/mount-footer.jsx"></script>

        <!-- Mobile-nav overlay: ahora vive en src/react/Nav.jsx (rama react/menu) -->

        <!-- ── APP BOTTOM NAV (React) — ver src/react/AppShell.jsx ── -->
        <div id="shell-root"></div>
        <script type="module" src="/src/react/mount-shell.jsx"></script>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
        <script src="/src/js/lib/supabaseClient.js"></script>
        <script src="/src/utils/i18n.js"></script>
        <script src="/src/utils/translations.js"></script>
        <script src="/src/js/langSwitcher.js"></script>
        <script src="/src/js/services/citiesService.js"></script>
        <script src="/src/js/utils/sanitize.js"></script>
        <script src="/src/js/utils/animations.js"></script>
        <script>
            (async function () {
                // Mismo criterio anti-XSS que el resto del proyecto (admin.js):
                // name/country ya son editables desde el admin.

                function escapeHtml(str) {
                    if (str === null || str === undefined) return '';
                    return String(str).replace(
                        /[&<>"']/g,
                        (ch) =>
                            ({
                                '&': '&amp;',
                                '<': '&lt;',
                                '>': '&gt;',
                                '"': '&quot;',
                                "'": '&#39;',
                            })[ch]
                    );
                }

                // ── Build flat city list sorted alphabetically ──────────────
                // Directorio completo (fetchAllCities, sin filtro active=true):
                // se listan todas las ciudades, tengan o no grupo activo.
                const citiesData = await fetchAllCities();
                const allCities = citiesData
                    .map((city) => ({
                        name: city.name,
                        country: city.country,
                        image_url: city.image_url,
                        url: `ciudad.html?ciudad=${city.id}`,
                    }))
                    .sort((a, b) => a.name.localeCompare(b.name, 'es'));

                // Stats
                const totalCountries = new Set(allCities.map((c) => c.country)).size;
                document.getElementById('totalCount').textContent = allCities.length;
                document.getElementById('totalCountries').textContent = totalCountries;
                document.getElementById('filterCount').textContent =
                    `${allCities.length} ${I18n.t('cities.count_suffix_plural')}`;

                // ── Group by first letter ───────────────────────────────────
                function groupByLetter(cities) {
                    const groups = {};
                    for (const city of cities) {
                        const letter = city.name[0].toUpperCase();
                        if (!groups[letter]) groups[letter] = [];
                        groups[letter].push(city);
                    }
                    return groups;
                }

                function renderGroups(cities) {
                    const section = document.getElementById('citiesSection');
                    const noResult = document.getElementById('noResults');
                    // Eliminar grupos anteriores
                    section.querySelectorAll('.letter-group').forEach((el) => el.remove());

                    if (!cities.length) {
                        noResult.classList.add('is-visible');
                        document.getElementById('filterCount').textContent =
                            `0 ${I18n.t('cities.count_suffix_plural')}`;
                        return;
                    }
                    noResult.classList.remove('is-visible');
                    document.getElementById('filterCount').textContent = `${cities.length} ${
                        cities.length !== 1
                            ? I18n.t('cities.count_suffix_plural')
                            : I18n.t('cities.count_suffix_singular')
                    }`;

                    const groups = groupByLetter(cities);
                    const sortedEntries = Object.entries(groups).sort();
                    // Índice global (no por letra) para que el stagger avance
                    // ciudad a ciudad a través de todos los grupos, no que se
                    // reinicie en cada encabezado de letra.
                    let globalIndex = 0;
                    for (const [letter, group] of sortedEntries) {
                        const div = document.createElement('div');
                        div.className = 'letter-group';
                        div.innerHTML = `
        <div class="letter-heading anim-fade-in">${escapeHtml(letter)}</div>
        <div class="city-items-grid">
          ${group
              .map((city) => {
                  const delayCls = `anim-delay-${(globalIndex++ % 8) + 1}`;
                  const safeImageUrl = sanitizeUrl(city.image_url);
                  return `
            <a class="city-card anim-fade-up ${delayCls}" href="${city.url}">
              ${
                  safeImageUrl
                      ? `<img class="card-img" src="${safeImageUrl}" alt="${escapeHtml(city.name)}" loading="lazy"/>`
                      : `<div class="card-img-placeholder"></div>`
              }
              <div class="card-overlay"></div>
              <div class="card-body">
                <div class="card-name">${escapeHtml(city.name)}</div>
                <span class="card-meta">${escapeHtml(city.country)}</span>
              </div>
            </a>`;
              })
              .join('')}
        </div>`;
                        section.insertBefore(div, noResult);
                    }

                    // Los grupos se regeneran por completo en cada tecleo del
                    // filtro — hay que volver a observarlas cada vez, si no
                    // las nuevas quedarían con opacity:0 para siempre.
                    if (window.initScrollReveal) window.initScrollReveal();
                }

                // Render inicial
                renderGroups(allCities);

                // ── Filter ──────────────────────────────────────────────────
                function normalize(str) {
                    return str
                        .normalize('NFD')
                        .replace(/[\u0300-\u036f]/g, '')
                        .toLowerCase();
                }

                const filterInput = document.getElementById('filterInput');
                const filterInputWrap = document.getElementById('filterInputWrap');

                function applyFilter() {
                    const q = filterInput.value.trim();
                    filterInputWrap.classList.toggle('has-value', q.length > 0);
                    const nq = normalize(q);
                    if (!nq) {
                        renderGroups(allCities);
                        return;
                    }
                    const filtered = allCities.filter(
                        (c) => normalize(c.name).includes(nq) || normalize(c.country).includes(nq)
                    );
                    renderGroups(filtered);
                }

                filterInput.addEventListener('input', applyFilter);

                document.getElementById('filterClear').addEventListener('click', () => {
                    filterInput.value = '';
                    filterInput.focus();
                    applyFilter();
                });
            })();
        </script>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                window.I18n.applyTranslations();
            });
        </script>
    </body>
</html>
