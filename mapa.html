<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Mapa — Erasmus Verified</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
        />
        <!-- Design System tokens -->
        <link rel="stylesheet" href="/src/styles/tokens.css" />
        <link rel="stylesheet" href="/src/styles/typography.css" />
        <link rel="stylesheet" href="/src/css/styles.css?" />
        <link rel="stylesheet" href="/src/css/animations.css" />
        <script src="/src/js/experience.js"></script>
        <style>
            /* Alta especificidad (#map > cualquier regla de clase) para garantizar
               la altura correcta aunque styles.css esté cacheado en versión antigua */

            #map.map-canvas {
                height: calc(100dvh - var(--header-h));
            }
        </style>
    </head>

    <body>
        <!-- ── TOP NAV (React, rama react/menu) — ver src/react/TopbarNav.jsx ── -->
        <script>
            window.__BACK_LINK__ = { i18nKey: 'nav.back', label: 'Volver', href: '#' };
        </script>
        <div id="nav-root"></div>
        <script type="module" src="/src/react/mount-topbar-nav.jsx"></script>

        <main class="map-page-main map-with-list">
            <div id="map" class="map-canvas anim-page-enter"></div>
            <aside id="partners-list" class="partners-list anim-page-enter"></aside>
        </main>

        <!-- FOOTER (React, rama react/menu) — ver src/react/Footer.jsx -->
        <div id="footer-root"></div>
        <script type="module" src="/src/react/mount-footer.jsx"></script>

        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""
        ></script>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
        <script src="/src/js/lib/supabaseClient.js"></script>
        <script src="/src/utils/i18n.js"></script>
        <script src="/src/utils/translations.js"></script>
        <script src="/src/js/langSwitcher.js"></script>
        <script src="/src/js/utils/sanitize.js"></script>
        <script src="/src/js/geocoder.js"></script>
        <script src="/src/js/map-helpers.js"></script>
        <script src="/src/js/services/partnersService.js"></script>
        <script src="/src/js/tracking.js"></script>
        <script src="/src/js/ui/sheet.js"></script>
        <script src="/src/js/utils/skeleton.js"></script>
        <script src="/src/js/mapPartners.js"></script>
        <script src="/src/js/cityMap.js"></script>
        <script src="/src/js/mapa.js"></script>

        <!-- Mobile-nav overlay: ahora vive en src/react/TopbarNav.jsx (rama react/menu) -->

        <!-- ── APP BOTTOM NAV (React) — ver src/react/AppShell.jsx ── -->
        <div id="shell-root"></div>
        <script type="module" src="/src/react/mount-shell.jsx"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                window.I18n.applyTranslations();
            });
        </script>
    </body>
</html>
